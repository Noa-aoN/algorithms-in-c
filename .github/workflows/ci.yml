name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: make test CC=${{ matrix.cc }}
      - run: make asan CC=${{ matrix.cc }}

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make valgrind CFLAGS="-O1 -g"

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: make cross

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tools
      - run: cppcheck --std=c11 --enable=warning,performance,portability --error-exitcode=1 -Itests $(ls -d */ | grep -v -e build -e docs -e tests)
      - run: scan-build --status-bugs make all
